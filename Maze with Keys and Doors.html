<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze with Keys and Doors</title>
<style>
:root{
  --bg:#e9edf2; --panel:#fbfcfd; --ink:#1b2430; --muted:#5b6778; --line:#cfd6df; --accent:#1f4e8c;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#161b22; --panel:#1f2630; --ink:#e7ecf2; --muted:#9aa7b8; --line:#34404f; --accent:#7fb0f0; }
}
:root[data-theme="dark"]{ --bg:#161b22; --panel:#1f2630; --ink:#e7ecf2; --muted:#9aa7b8; --line:#34404f; --accent:#7fb0f0; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
main{max-width:1060px;margin:0 auto;padding:20px 16px 40px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}
@media (max-width:820px){main{grid-template-columns:1fr}}
h1{font-size:22px;margin:0 0 4px;grid-column:1/-1;letter-spacing:.2px}
.sub{color:var(--muted);margin:0 0 6px;grid-column:1/-1}
.board{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
canvas{max-width:100%;border:2px solid #111;border-radius:4px;background:#fff}
.status{min-height:24px;font-weight:600;text-align:center}
aside{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:15px;margin:0 0 8px}
label{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;color:var(--muted)}
input[type=number],input[type=range]{accent-color:var(--accent)}
input[type=number]{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
button{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{color:#0e1a2b}}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.result{font-size:26px;font-weight:700}
.inv{display:flex;flex-wrap:wrap;gap:8px;min-height:38px}
.slot{width:36px;height:36px;border-radius:8px;border:2px dashed var(--line);display:grid;place-items:center;font-weight:700;color:#fff;transition:transform .25s}
.slot.have{border:2px solid #111;transform:scale(1.08)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;color:var(--muted);font-size:13px}
.sw{display:inline-block;width:12px;height:12px;border:1px solid #111;margin-right:6px;vertical-align:-1px}
@media (prefers-reduced-motion:reduce){.slot{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Maze with keys and doors</h1>
  <p class="sub">Shortest path from S to E. Doors open only with the matching key.</p>

  <section class="board">
    <canvas id="cv" aria-label="Maze grid"></canvas>
    <div class="status" id="status" aria-live="polite"></div>
    <input type="range" id="scrub" min="0" max="0" value="0" style="width:100%" aria-label="Step">
  </section>

  <aside>
    <div class="card">
      <h2>Maze</h2>
      <label>Key/door types T <input type="number" id="T" min="1" max="6" value="3"></label>
      <label>Grid size N <input type="number" id="N" min="5" max="40" value="12"></label>
      <label>Seed <input type="number" id="seed" value="1"></label>
      <div class="row">
        <button class="primary" id="gen">Generate</button>
        <button id="rand">New seed</button>
        <button id="load">Load CSV</button>
        <input type="file" id="file" accept=".csv,text/csv,text/plain" hidden>
      </div>
    </div>

    <div class="card">
      <h2>Shortest path</h2>
      <div class="result" id="len">–</div>
      <div class="row">
        <button class="primary" id="play">Play</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
      </div>
      <label>Speed <input type="range" id="speed" min="1" max="20" value="6"></label>
      <div class="row"><button id="dl">Download solved CSV</button></div>
    </div>

    <div class="card">
      <h2>Key inventory</h2>
      <div class="inv" id="inv"></div>
    </div>

    <div class="card">
      <h2>Legend</h2>
      <div class="legend">
        <span><i class="sw" style="background:#fff"></i>Open</span>
        <span><i class="sw" style="background:#000"></i>Wall</span>
        <span><i class="sw" style="background:#22a447"></i>Start</span>
        <span><i class="sw" style="background:#e02424"></i>Exit</span>
        <span><i class="sw" style="background:#ffe066"></i>Path</span>
        <span>Door opened: 🔓</span>
      </div>
    </div>
  </aside>
</main>

<script>
// 'E' is the exit, so the 5th/6th types use letters f and g (doors F, G).
const KEYS = 'abcdfg';
const COLORS = ['#2f6fe4', '#f08a1c', '#8e44ad', '#12a8c9', '#d6249f', '#8a5a2b'];
const isKey = ch => KEYS.includes(ch);
const isDoor = ch => ch !== ch.toLowerCase() && KEYS.includes(ch.toLowerCase());
const bit = ch => KEYS.indexOf(ch.toLowerCase());
const colorOf = ch => COLORS[bit(ch)];

function rngFrom(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- solver: BFS over (row, col, key mask) ----------
function solve(grid){
  const n = grid.length; let S, E;
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){ if (grid[r][c] === 'S') S = [r, c]; else if (grid[r][c] === 'E') E = [r, c]; }
  if (!S || !E) return { len: -1, path: null };
  const M = 64, size = n * n * M;
  const par = new Int32Array(size).fill(-2);
  const q = new Int32Array(size);
  let h = 0, t = 0;
  const s0 = (S[0] * n + S[1]) * M; par[s0] = -1; q[t++] = s0;
  const D = [[1,0],[-1,0],[0,1],[0,-1]];
  while (h < t){
    const cur = q[h++], mask = cur % M, cell = (cur - mask) / M, r = (cell / n) | 0, c = cell % n;
    if (r === E[0] && c === E[1]){
      const path = []; for (let s = cur; s !== -1; s = par[s]) { const cc = ((s - s % M) / M); path.push([(cc / n) | 0, cc % n]); }
      path.reverse(); return { len: path.length - 1, path };
    }
    for (const [dr, dc] of D){
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nc < 0 || nr >= n || nc >= n) continue;
      const ch = grid[nr][nc]; if (ch === '#') continue;
      let nm = mask;
      if (isDoor(ch)){ if (!((mask >> bit(ch)) & 1)) continue; }
      else if (isKey(ch)) nm |= 1 << bit(ch);
      const ns = (nr * n + nc) * M + nm;
      if (par[ns] === -2){ par[ns] = cur; q[t++] = ns; }
    }
  }
  return { len: -1, path: null };
}

// ---------- generator ----------
function generate(n, T, seed){
  const rnd = rngFrom(seed); let fallback = null;
  for (let tries = 0; tries < 3000; tries++){
    const g = Array.from({ length: n }, () => Array.from({ length: n }, () => rnd() < 0.25 ? '#' : '.'));
    const cells = []; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) cells.push([r, c]);
    for (let i = cells.length - 1; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; [cells[i], cells[j]] = [cells[j], cells[i]]; }
    const p = cells.slice(0, 2 + 2 * T);
    g[p[0][0]][p[0][1]] = 'S'; g[p[1][0]][p[1][1]] = 'E';
    for (let i = 0; i < T; i++){ g[p[2+2*i][0]][p[2+2*i][1]] = KEYS[i]; g[p[3+2*i][0]][p[3+2*i][1]] = KEYS[i].toUpperCase(); }
    const res = solve(g); if (res.len < 0) continue;
    if (!fallback) fallback = g;
    if (res.path.some(([r, c]) => isDoor(g[r][c]))) return g;   // prefer mazes where a door matters
  }
  if (fallback) return fallback;
  const g = Array.from({ length: n }, () => Array(n).fill('.')); g[0][0] = 'S'; g[n-1][n-1] = 'E';
  for (let i = 0; i < T; i++) g[0][1 + i] = KEYS[i];
  return g;
}

// ---------- CSV ----------
function parseCSV(text){
  const rows = text.split(/\r?\n/).filter(l => l.trim() !== '').map(l => l.split(',').map(x => x.trim() || '.'));
  const n = rows.length;
  if (n < 2 || rows.some(r => r.length !== n)) throw new Error('CSV must be a square N x N grid.');
  const flat = rows.flat();
  if (flat.filter(x => x === 'S').length !== 1 || flat.filter(x => x === 'E').length !== 1) throw new Error('The grid needs exactly one S and one E.');
  return rows;
}
function solvedCSV(){
  const out = grid.map(r => r.slice());
  if (sol.path) for (const [r, c] of sol.path) if (out[r][c] === '.') out[r][c] = 'x';
  return out.map(r => r.join(',')).join('\n') + '\n';
}

// ---------- state ----------
let grid, sol, firstVisit, events, k = 0, playing = false, timer = 0, cell = 40;
const $ = id => document.getElementById(id), cv = $('cv'), ctx = cv.getContext('2d');

function setMaze(g){
  grid = g; sol = solve(g); k = 0; stop();
  firstVisit = new Map(); events = [];
  if (sol.path){
    let mask = 0;
    sol.path.forEach(([r, c], i) => {
      const ch = grid[r][c], id = r * grid.length + c;
      if (!firstVisit.has(id)) firstVisit.set(id, i);
      let ev = null;
      if (isKey(ch) && !((mask >> bit(ch)) & 1)){ mask |= 1 << bit(ch); ev = 'Picked up key ' + ch; }
      else if (isDoor(ch) && events[i] == null && firstVisit.get(id) === i) ev = 'Unlocked door ' + ch;
      events[i] = ev;
    });
  }
  $('len').textContent = sol.len < 0 ? '-1 (no path)' : sol.len + ' steps';
  $('scrub').max = sol.path ? sol.path.length - 1 : 0; $('scrub').value = 0;
  ['play','step','scrub','dl'].forEach(id => $(id).disabled = !sol.path && id !== 'dl' ? true : false);
  $('dl').disabled = !sol.path;
  sizeCanvas(); draw();
}

function sizeCanvas(){
  const n = grid.length, avail = Math.min(640, $('cv').parentElement.clientWidth - 24 || 640);
  cell = Math.max(14, Math.floor(avail / n));
  const px = cell * n, dpr = window.devicePixelRatio || 1;
  cv.width = px * dpr; cv.height = px * dpr; cv.style.width = px + 'px'; cv.style.height = px + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function draw(){
  const n = grid.length, path = sol.path, cur = path ? path[k] : null;
  ctx.clearRect(0, 0, n * cell, n * cell);
  const have = new Set();
  const visited = new Set();
  if (path) for (let i = 0; i <= k; i++){ const [r, c] = path[i]; visited.add(r * n + c); if (isKey(grid[r][c])) have.add(grid[r][c]); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++){
    const ch = grid[r][c], x = c * cell, y = r * cell, id = r * n + c, seen = visited.has(id);
    ctx.fillStyle = ch === '#' ? '#000' : ch === 'S' ? '#22a447' : ch === 'E' ? '#e02424' : '#fff';
    ctx.fillRect(x, y, cell, cell);
    if (ch !== '#' && ch !== 'S' && ch !== 'E' && seen && !isDoor(ch)){ ctx.fillStyle = 'rgba(255,224,102,.75)'; ctx.fillRect(x, y, cell, cell); }
    if (isDoor(ch)){
      if (seen){ ctx.fillStyle = 'rgba(255,224,102,.75)'; ctx.fillRect(x, y, cell, cell); ctx.font = (cell * .6) + 'px sans-serif'; ctx.fillStyle = '#000'; ctx.fillText('🔓', x + cell / 2, y + cell / 2 + 1); }
      else { ctx.fillStyle = colorOf(ch); ctx.fillRect(x + 1, y + 1, cell - 2, cell - 2); ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (cell * .5) + 'px sans-serif'; ctx.fillText(ch, x + cell / 2, y + cell / 2 + 1); }
    } else if (isKey(ch) && !seen){
      ctx.fillStyle = colorOf(ch); ctx.beginPath(); ctx.arc(x + cell / 2, y + cell / 2, cell * .32, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (cell * .42) + 'px sans-serif'; ctx.fillText(ch, x + cell / 2, y + cell / 2 + 1);
    } else if (ch === 'S' || ch === 'E'){ ctx.fillStyle = '#fff'; ctx.font = 'bold ' + (cell * .55) + 'px sans-serif'; ctx.fillText(ch, x + cell / 2, y + cell / 2 + 1); }
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.strokeRect(x + .5, y + .5, cell, cell);
  }
  if (path){
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = Math.max(2, cell * .12); ctx.lineJoin = 'round'; ctx.beginPath();
    for (let i = 0; i <= k; i++){ const [r, c] = path[i], x = c * cell + cell / 2, y = r * cell + cell / 2; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cur[1] * cell + cell / 2, cur[0] * cell + cell / 2, cell * .2, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  }
  // inventory
  const T = KEYS.split('').filter(ch => grid.flat().includes(ch));
  $('inv').innerHTML = T.map(ch => `<div class="slot${have.has(ch) ? ' have' : ''}" style="${have.has(ch) ? 'background:' + colorOf(ch) : ''}">${have.has(ch) ? ch : ''}</div>`).join('') || '<span style="color:var(--muted)">No keys in this maze</span>';
  $('scrub').value = k;
  $('status').textContent = !path ? 'No path exists: answer is -1.' : (events[k] || (k === path.length - 1 ? 'Reached the exit in ' + sol.len + ' steps.' : 'Step ' + k + ' of ' + sol.len));
}

function stop(){ playing = false; clearInterval(timer); $('play').textContent = 'Play'; }
function tick(){ if (!sol.path) return stop(); if (k < sol.path.length - 1){ k++; draw(); } else stop(); }
function play(){
  if (!sol.path) return;
  if (playing) return stop();
  if (k >= sol.path.length - 1) k = 0;
  playing = true; $('play').textContent = 'Pause';
  const ms = 1100 - $('speed').value * 50;
  timer = setInterval(tick, ms); draw();
}

$('play').onclick = play;
$('step').onclick = () => { stop(); tick(); };
$('reset').onclick = () => { stop(); k = 0; draw(); };
$('scrub').oninput = e => { stop(); k = +e.target.value; draw(); };
$('speed').oninput = () => { if (playing){ clearInterval(timer); timer = setInterval(tick, 1100 - $('speed').value * 50); } };
function gen(){
  const T = Math.min(6, Math.max(1, +$('T').value || 1)), N = Math.min(40, Math.max(5, +$('N').value || 10));
  $('T').value = T; $('N').value = N; setMaze(generate(N, T, +$('seed').value || 0));
}
$('gen').onclick = gen;
$('rand').onclick = () => { $('seed').value = (Math.random() * 1e6) | 0; gen(); };
$('load').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { setMaze(parseCSV(await f.text())); } catch (err) { $('status').textContent = err.message; }
  e.target.value = '';
};
$('dl').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([solvedCSV()], { type: 'text/csv' })); a.download = 'solved.csv'; a.click();
};
addEventListener('resize', () => { sizeCanvas(); draw(); });
gen();
</script>
</body>
</html>
